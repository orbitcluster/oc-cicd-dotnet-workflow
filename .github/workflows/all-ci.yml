name: App CI/CD

on:
  workflow_call:
    inputs:
      app-name:
        description: "Name of the image/app"
        required: false
        default: ${{ github.repository }}
        type: string
      appid:
        description: "Application ID"
        required: false
        default: "0"
        type: string
      orgid:
        description: "Organization ID"
        required: false
        default: "0"
        type: string
      buid:
        description: "Business Unit ID"
        required: false
        default: "0"
        type: string
      test-directory:
        description: "Directory containing tests"
        required: false
        default: "test"
        type: string
      sonar-source-path:
        description: "Path to the source code for SonarQube scan"
        required: false
        default: "src"
        type: string
      dotnet-version:
        description: ".NET SDK version to use"
        required: false
        default: "8.0.x"
        type: string
      solution-path:
        description: "Path to the solution or project file"
        required: false
        default: "."
        type: string
    secrets:
      role-to-assume:
        description: "Role to assume"
        required: true
jobs:
  secrets-check:
    name: Secrets Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Secrets Check
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: orbitcluster/oc-cicd-secretscanner-workflow@v2

  sonarqube-check:
    name: SonarQube Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: SonarQube Check
        uses: orbitcluster/oc-cicd-sonarscan-workflow@v1
        with:
          sonar-source-path: ${{ inputs.sonar-source-path }}
          dotnet-build-command: dotnet build ${{ inputs.solution-path }} --configuration Release

  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        shell: bash
        run: dotnet restore ${{ inputs.solution-path }}

      - name: Build
        shell: bash
        run: dotnet build ${{ inputs.solution-path }} --configuration Release --no-restore

      - name: SAST Scan
        uses: orbitcluster/oc-cicd-sast-workflow@v1
        with:
          language: csharp

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.release-version }}
    steps:
      - uses: actions/checkout@v6
      - name: Semantic Version
        id: semver
        uses: orbitcluster/oc-cicd-release-workflow@v1
        with:
          dry-run: ${{ github.ref_name != 'main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [secrets-check, sonarqube-check, sast-scan, semantic-release]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Docker Build
        id: docker-build
        uses: orbitcluster/oc-cicd-docker-build-workflow@v1
        with:
          docker-build-path: .
          image-name: ${{ inputs.app-name }}
          tag-override: ${{ github.ref_name == 'main' && needs.semantic-release.outputs.version || '' }}
          appid: ${{ inputs.appid }}
          orgid: ${{ inputs.orgid }}
          buid: ${{ inputs.buid }}

      - name: Docker Push / Cleanup
        id: docker-push
        uses: orbitcluster/oc-cicd-docker-push-workflow@v1
        with:
          image_type: docker
          image-name: ${{ inputs.app-name }}
          tag: ${{ steps.docker-build.outputs.docker-tag }}
          appid: ${{ inputs.appid }}
          orgid: ${{ inputs.orgid }}
          buid: ${{ inputs.buid }}
          role-to-assume: ${{ secrets.role-to-assume }}
          action_type: ${{ github.event_name == 'pull_request' && 'cleanup' || 'push' }}
          branch-name: ${{ steps.docker-build.outputs.safe-branch }}
