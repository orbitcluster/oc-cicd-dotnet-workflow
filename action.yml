name: "Build and Test"
description: "Build and Test the .NET application"
inputs:
  dotnet-version:
    description: ".NET SDK version to use"
    required: false
    default: "8.0.x"
  solution-path:
    description: "Path to the solution or project file"
    required: false
    default: "."
  test-project-path:
    description: "Path to the test project"
    required: false
    default: "test"
  app-name:
    description: "Name of the image"
    required: false
    default: ${{ github.repository }}
  appid:
    description: "Application ID"
    required: false
    default: "0"
  orgid:
    description: "Organization ID"
    required: false
    default: "0"
  buid:
    description: "Business Unit ID"
    required: false
    default: "0"
  role-to-assume:
    description: "Role to assume"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Semantic Release
      id: semver
      uses: orbitcluster/oc-cicd-release-workflow@v1
      with:
        dry-run: ${{ github.ref_name != 'main' }}
        github-token: ${{ github.token }}

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore dependencies
      shell: bash
      run: dotnet restore ${{ inputs.solution-path }}

    - name: Build
      shell: bash
      run: dotnet build ${{ inputs.solution-path }} --configuration Release --no-restore

    - name: Test
      shell: bash
      run: |
        if [ -d "${{ inputs.test-project-path }}" ]; then
          dotnet test ${{ inputs.test-project-path }} --configuration Release --no-build --verbosity normal
        else
          echo "No test directory found at ${{ inputs.test-project-path }}, skipping tests"
        fi

    - name: Secrets Check
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: orbitcluster/oc-cicd-secretscanner-workflow@v2
      with:
        github-token: ${{ github.token }}

    - name: SonarQube Check
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: orbitcluster/oc-cicd-sonarscan-workflow@v1
      with:
        sonar-source-path: ${{ inputs.solution-path }}
        dotnet-build-command: dotnet build ${{ inputs.solution-path }} --configuration Release

    - name: SAST Scan
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: orbitcluster/oc-cicd-sast-workflow@v1
      with:
        language: csharp

    - name: Docker Build
      id: docker-build
      uses: orbitcluster/oc-cicd-docker-build-workflow@feat/update_tag_logic
      with:
        docker-build-path: .
        image-name: ${{ inputs.app-name }}
        tag-override: ${{ github.ref_name == 'main' && steps.semver.outputs.release-version || '' }}
        appid: ${{ inputs.appid }}
        orgid: ${{ inputs.orgid }}
        buid: ${{ inputs.buid }}

    - name: Docker Push
      id: docker-push
      uses: orbitcluster/oc-cicd-docker-push-workflow@feat/add_helm_push
      with:
        image_type: docker
        image-name: ${{ inputs.app-name }}
        tag: ${{ steps.docker-build.outputs.docker-tag }}
        appid: ${{ inputs.appid }}
        orgid: ${{ inputs.orgid }}
        buid: ${{ inputs.buid }}
        role-to-assume: ${{ inputs.role-to-assume }}
        action_type: ${{ github.event_name == 'pull_request' && 'cleanup' || 'push' }}
        branch-name: ${{ steps.docker-build.outputs.safe-branch }}
